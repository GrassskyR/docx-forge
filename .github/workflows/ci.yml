name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install LibreOffice & Poppler
        run: sudo apt-get update && sudo apt-get install -y libreoffice poppler-utils

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, Stylecheck & Build
        run: npm run typecheck && npm run stylecheck && npm run build

      - name: Build Desktop Bundle
        run: npm run build -w @docs-agent/desktop

      - name: Run Tests
        run: npm test
