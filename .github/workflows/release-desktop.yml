name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install LibreOffice & Poppler
        run: sudo apt-get update && sudo apt-get install -y libreoffice poppler-utils

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, Stylecheck, Build & Test
        run: npm run typecheck && npm run stylecheck && npm run build && npm test

  build-desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            script: dist:linux
          - os: windows-latest
            platform: win
            script: dist:win
          - os: macos-latest
            platform: mac
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Linux Poppler
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install macOS Poppler
        if: matrix.platform == 'mac'
        run: brew install poppler

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundled Poppler
        run: npx tsx scripts/prepare_poppler.ts --platform=${{ matrix.platform }}

      - name: Build Web & Desktop Bundle
        run: npm run build:desktop

      - name: Package Electron App
        run: npm run ${{ matrix.script }} -w @docs-agent/desktop

      - name: Create Windows Portable Zip (with portable.txt)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $pkg = Get-Content packages/desktop/package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $src = "packages/desktop/release/win-unpacked"
          $stage = "packages/desktop/release/DocForge-Portable-$ver-win-x64"
          Copy-Item $src $stage -Recurse -Force
          Set-Content -Path (Join-Path $stage "portable.txt") -Value "Portable mode enabled"
          Compress-Archive -Path "$stage/*" -DestinationPath "packages/desktop/release/DocForge-Portable-$ver-win-x64.zip" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docforge-${{ matrix.platform }}
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.zip
            packages/desktop/release/*.dmg
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
          if-no-files-found: error

  publish-release:
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
