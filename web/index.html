<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>公文格式工作台</title>
    <style>
      :root {
        font: 16px/1.6 system-ui;
        color: #182b40;
        background: #f0f3f6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      header {
        padding: 20px 32px;
        background: #173b50;
        color: white;
      }
      h1 {
        font-size: 24px;
        margin: 0;
      }
      header small {
        color: #c4d8e4;
      }
      main {
        display: grid;
        grid-template-columns: minmax(320px, 420px) 1fr;
        gap: 24px;
        padding: 24px;
        max-width: 1600px;
        margin: auto;
      }
      section {
        background: white;
        border: 1px solid #d9e2e9;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 18px;
      }
      h2 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      input,
      textarea,
      select,
      button {
        font: inherit;
        border-radius: 6px;
        padding: 8px;
        border: 1px solid #bdcbd5;
        max-width: 100%;
      }
      input:not([type="file"]),
      textarea {
        width: 100%;
        margin: 6px 0;
      }
      button,
      a.download {
        cursor: pointer;
        background: #146b79;
        color: white;
        border: 0;
        padding: 8px 14px;
        text-decoration: none;
        display: inline-block;
        margin: 4px;
      }
      button.secondary {
        background: #e6eef1;
        color: #234;
      }
      textarea {
        resize: vertical;
        min-height: 74px;
      }
      .profile {
        padding: 8px;
        border-bottom: 1px solid #e6edf2;
      }
      .active {
        background: #e0f3ec;
        border-left: 4px solid #148563;
      }
      .muted {
        color: #607180;
        font-size: 14px;
      }
      #messages {
        max-height: 330px;
        overflow: auto;
        white-space: pre-wrap;
      }
      #status {
        padding: 8px 24px;
        min-height: 38px;
        color: #993c20;
      }
      #previews img {
        width: 100%;
        max-width: 800px;
        display: block;
        margin: 16px auto;
        box-shadow: 0 3px 15px #0002;
      }
      #audit {
        overflow-wrap: anywhere;
      }
      li {
        margin: 8px 0;
      }
      @media (max-width: 850px) {
        main {
          grid-template-columns: 1fr;
          padding: 12px;
        }
      }
      details pre {
        white-space: pre-wrap;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>公文格式工作台</h1>
      <small>格式预设 · 智能起草 · Word 生成与逐项审计</small>
    </header>
    <div id="status" role="status"></div>
    <main>
      <aside>
        <section>
          <h2>格式预设库</h2>
          <p class="muted">选定默认预设后，新建与改写均自动套用。</p>
          <div id="profiles"></div>
        </section>
        <section>
          <h2>从 Word 导入格式</h2>
          <form id="upload">
            <input name="name" placeholder="预设名称" required />
            <input name="file" type="file" accept=".doc,.docx" required />
            <button>提取并保存</button>
          </form>
        </section>
        <section>
          <h2>描述格式 / 增量微调</h2>
          <form id="nl">
            <input id="profileName" placeholder="新预设名称" required />
            <select id="base">
              <option value="">以国标创建</option>
            </select>
            <textarea
              id="instruction"
              required
              placeholder="正文三号仿宋_GB2312，固定行距28磅，首行缩进2字符"
            ></textarea>
            <button>保存格式预设</button>
          </form>
        </section>
        <section>
          <h2>与公文 Agent 对话</h2>
          <select id="branches" aria-label="会话分支"></select>
          <button id="fork" type="button" class="secondary">分叉当前版本</button>
          <p id="branchInfo" class="muted" aria-live="polite"></p>
          <div id="messages" aria-live="polite"></div>
          <form id="chat">
            <textarea
              id="prompt"
              required
              placeholder="请起草一份关于开展培训的通知，主送各部门……"
            ></textarea>
            <button>发送</button>
          </form>
          <details>
            <summary>直接生成示例（无需 LLM）</summary>
            <button id="sample">用当前格式生成示例通知</button>
          </details>
        </section>
      </aside>
      <article>
        <section>
          <h2>文档与格式审计</h2>
          <div id="audit" class="muted">生成后在这里查看合规率和逐项差异。</div>
          <a id="download" class="download" hidden>下载 Word 文档</a>
        </section>
        <div id="previews"><section class="muted">页面预览将在生成后显示。</section></div>
      </article>
    </main>
    <script>
      let active = ""
      let profileNames = new Map()
      let currentBranch = null
      const $ = (id) => document.getElementById(id)
      const agent = `http://${location.hostname}:8787`
      function status(message) {
        $("status").textContent = message
      }
      async function api(url, body, method = "POST") {
        const r = await fetch(url, {
          method: body ? method : "GET",
          headers: body instanceof FormData ? {} : { "Content-Type": "application/json" },
          body: body instanceof FormData ? body : body ? JSON.stringify(body) : undefined,
        })
        const j = await r.json()
        if (!r.ok) throw Error(JSON.stringify(j))
        return j
      }
      async function refresh() {
        const data = await api("/api/profiles")
        active = data.active_profile_id
        profileNames = new Map(data.profiles.map((profile) => [profile.id, profile.name]))
        updateBranchLabel()
        $("profiles").replaceChildren()
        $("base").length = 1
        for (const p of data.profiles) {
          const row = document.createElement("div")
          row.className = "profile" + (p.id === active ? " active" : "")
          const label = document.createElement("span")
          label.textContent = p.name + (p.id === active ? " ✓ 当前默认" : "")
          row.append(label)
          const b = document.createElement("button")
          b.className = "secondary"
          b.textContent = "设为默认"
          b.onclick = () =>
            run(async () => {
              await api("/api/profiles/active", { profile_id: p.id }, "PUT")
              currentBranch = currentBranch && { ...currentBranch, profile_id: p.id }
              await refresh()
            })
          row.append(b)
          $("profiles").append(row)
          $("base").add(new Option(p.name, p.id))
        }
      }
      async function run(fn) {
        try {
          status("处理中…")
          await fn()
          status("已完成")
        } catch (e) {
          status(e.message)
        }
      }
      function show(result) {
        $("audit").replaceChildren()
        const h = document.createElement("strong")
        h.textContent = `合规率 ${result.lint_report.score}% · ${result.lint_report.passed ? "通过" : "存在差异"}`
        $("audit").append(h)
        const ul = document.createElement("ul")
        for (const v of result.lint_report.violations) {
          const li = document.createElement("li")
          li.textContent = `${v.location} ${v.field}：期望 ${JSON.stringify(v.expected)}，实际 ${JSON.stringify(v.actual)}`
          ul.append(li)
        }
        $("audit").append(ul)
        $("previews").replaceChildren()
        for (const url of result.preview_urls) {
          const im = document.createElement("img")
          im.src = url
          im.alt = "生成公文页面预览"
          $("previews").append(im)
        }
        $("download").hidden = false
        $("download").href = result.docx_url
        $("download").download = "公文.docx"
      }
      $("upload").onsubmit = (e) => {
        e.preventDefault()
        run(async () => {
          await api("/api/profiles/extract", new FormData(e.target))
          await refresh()
        })
      }
      $("nl").onsubmit = (e) => {
        e.preventDefault()
        run(async () => {
          const base = $("base").value
          await api(
            base ? `/api/profiles/${base}/fork` : "/api/profiles/from-nl",
            base
              ? { name: $("profileName").value, patch_instruction: $("instruction").value }
              : { name: $("profileName").value, instruction: $("instruction").value },
          )
          await refresh()
        })
      }
      function updateBranchLabel() {
        if (!currentBranch) return
        const profile = profileNames.get(currentBranch.profile_id) || currentBranch.profile_name
        $("branchInfo").textContent = `当前分支 ${currentBranch.name} · 绑定预设 ${profile}`
      }

      function messageText(message) {
        if (typeof message.content === "string") return message.content
        if (!Array.isArray(message.content)) return ""
        return message.content
          .filter((part) => part.type === "text" && typeof part.text === "string")
          .map((part) => part.text)
          .join("\n")
      }

      function addMessage(role, text) {
        const line = document.createElement("p")
        line.textContent = (role === "user" ? "我：" : "助手：") + text
        $("messages").append(line)
        return line
      }

      function showBranch(node) {
        currentBranch = node
        $("branches").value = node.id
        updateBranchLabel()
        $("messages").replaceChildren()
        for (const message of node.messages) {
          if (message.role !== "user" && message.role !== "assistant") continue
          const text = messageText(message)
          if (text) addMessage(message.role, text)
        }
      }

      async function branches() {
        const state = await api(agent + "/sessions")
        $("branches").replaceChildren()
        for (const node of state.nodes) $("branches").add(new Option(node.name, node.id))
        showBranch(state.node)
      }

      $("branches").onchange = () =>
        run(async () => {
          try {
            const node = await api(agent + "/sessions/switch", { id: $("branches").value })
            await refresh()
            showBranch(node)
          } catch (error) {
            $("branches").value = currentBranch?.id || ""
            throw error
          }
        })

      $("fork").onclick = () =>
        run(async () => {
          const node = await api(agent + "/sessions/fork", {
            name: "版本 " + new Date().toLocaleTimeString(),
            profile_id: active,
          })
          await refresh()
          $("branches").add(new Option(node.name, node.id))
          showBranch(node)
        })
      $("chat").onsubmit = (e) => {
        e.preventDefault()
        run(async () => {
          const prompt = $("prompt").value
          addMessage("user", prompt)
          let assistantLine
          const response = await fetch(agent + "/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt }),
          })
          if (!response.ok) throw Error(await response.text())
          const reader = response.body.getReader()
          let pending = ""
          const decoder = new TextDecoder()
          while (true) {
            const { done, value } = await reader.read()
            if (done) break
            pending += decoder.decode(value, { stream: true })
            let index
            while ((index = pending.indexOf("\n\n")) >= 0) {
              const part = pending.slice(0, index)
              pending = pending.slice(index + 2)
              if (!part.startsWith("data: ")) continue
              const event = JSON.parse(part.slice(6))
              if (event.type === "text") {
                if (!assistantLine) assistantLine = addMessage("assistant", "")
                assistantLine.append(event.text)
              }
              if (event.type === "document") show(event.result)
              if (event.type === "error") throw Error(event.error)
            }
          }
          await refresh()
          await branches()
        })
      }
      $("sample").onclick = () =>
        run(async () =>
          show(
            await api("/api/documents/render", {
              content_ast: {
                doc_type: "notice",
                title: "关于开展业务培训的通知",
                recipient: "各部门：",
                blocks: [
                  { type: "heading_1", text: "一、培训安排" },
                  {
                    type: "body",
                    text: "为提高业务能力，拟于近期开展专题培训，请各部门做好组织工作。",
                  },
                ],
                signature: "综合办公室",
                date: "2026年11月24日",
              },
            }),
          ),
        )
      run(async () => {
        await refresh()
        await branches()
      })
    </script>
  </body>
</html>
