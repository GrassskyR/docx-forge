<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DocForge V3 · 极简瑞士风（普通模式 + 调试模式）</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --sidebar: #F4F6F9;
      --canvas: #EEF2F6;
      --border: #E2E8F0;
      --ink: #0F172A;
      --ink-2: #334155;
      --muted: #64748B;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-soft: #EFF6FF;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .dot-grid {
      background-color: var(--canvas);
      background-image: radial-gradient(#CBD5E1 0.8px, transparent 0.8px);
      background-size: 20px 20px;
    }

    .paper-a4 {
      background: #FFFFFF;
      color: #18181B;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.09), 0 1px 3px rgba(15, 23, 42, 0.05);
      font-family: "Songti SC", "STSong", "FangSong", "Noto Serif SC", Georgia, serif;
      transition: transform 0.2s ease;
      transform-origin: top center;
    }

    .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 999px; }
    .scroll-thin::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    .tabular { font-variant-numeric: tabular-nums; }

    /* Clean toggle switch */
    .switch-track {
      width: 32px;
      height: 18px;
      border-radius: 999px;
      background: #CBD5E1;
      position: relative;
      transition: background-color 0.2s ease;
    }
    .switch-track.on { background: #2563EB; }
    .switch-thumb {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #FFFFFF;
      position: absolute;
      top: 2px;
      left: 2px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.2);
      transition: transform 0.2s ease;
    }
    .switch-track.on .switch-thumb { transform: translateX(14px); }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col select-none">

  <!-- TOP BAR (54px) -->
  <header class="h-[54px] shrink-0 bg-white border-b border-[#E2E8F0] px-5 flex items-center justify-between gap-4 z-30">
    <!-- Left: Quiet Brand + Format Picker Trigger -->
    <div class="flex items-center gap-3.5 min-w-0">
      <div class="flex items-center gap-2 shrink-0">
        <div class="w-7 h-7 rounded-lg bg-[#2563EB] text-white flex items-center justify-center">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="8" y1="13" x2="16" y2="13"/>
            <line x1="8" y1="17" x2="13" y2="17"/>
          </svg>
        </div>
        <span class="font-semibold text-[14.5px] tracking-tight text-[#0F172A]">DocForge</span>
      </div>

      <div class="h-4 w-px bg-[#E2E8F0]"></div>

      <!-- Format Picker Pill (Always visible, primary way normal users pick/import formats) -->
      <div class="relative">
        <button id="formatPickerBtn" class="h-8 pl-3 pr-2.5 rounded-lg bg-[#F8FAFC] hover:bg-[#F1F5F9] border border-[#E2E8F0] flex items-center gap-2 text-[12.5px] transition cursor-pointer">
          <span class="text-[#64748B]">格式</span>
          <span id="topFormatName" class="font-medium text-[#0F172A] max-w-[200px] truncate">学校红头下行文模板</span>
          <span id="topFormatCat" class="text-[10.5px] px-1.5 py-0.5 rounded bg-[#EFF6FF] text-[#2563EB] font-medium">公文</span>
          <svg class="w-3.5 h-3.5 text-[#64748B]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <!-- Format Picker Popover (For Normal Mode — clean, closes after picking) -->
        <div id="formatPopover" class="hidden absolute left-0 top-10 w-[340px] bg-white border border-[#E2E8F0] rounded-xl shadow-xl overflow-hidden z-50">
          <div class="p-3 border-b border-[#F1F5F9] flex items-center justify-between">
            <span class="text-[12.5px] font-semibold text-[#0F172A]">选择文档格式</span>
            <button id="popoverImportBtn" class="text-[12px] font-medium text-[#2563EB] hover:text-[#1D4ED8] flex items-center gap-1 cursor-pointer">
              <span>+ 导入新范例</span>
            </button>
          </div>
          <div id="popoverCatTabs" class="px-3 pt-2.5 pb-1.5 flex items-center gap-1 text-[11.5px]"></div>
          <div id="popoverList" class="p-2 max-h-[300px] overflow-y-auto scroll-thin space-y-1"></div>
        </div>
      </div>
    </div>

    <!-- Right: Debug-only telemetry + Quiet Debug Mode Toggle -->
    <div class="flex items-center gap-2.5 shrink-0 text-[12px]">
      <!-- Debug-Only Controls -->
      <div id="debugHeaderTools" class="hidden items-center gap-2">
        <div class="flex items-center bg-[#F8FAFC] border border-[#E2E8F0] rounded-lg p-0.5">
          <select id="branchSelect" class="bg-transparent text-[11.5px] font-medium text-[#0F172A] py-1 pl-2 pr-1 outline-none cursor-pointer"></select>
          <button id="forkBranchBtn" class="px-2 py-1 rounded-md text-[11px] font-medium text-[#475569] hover:bg-white transition cursor-pointer">+ 分叉</button>
        </div>

        <div class="hidden md:flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[#ECFDF5] border border-[#A7F3D0] text-[#047857] font-mono text-[11px] tabular">
          <span class="w-1.5 h-1.5 rounded-full bg-[#10B981]"></span>
          <span id="tokenText">1,240 tok · ¥0.002</span>
        </div>

        <button id="visionModeToggle" class="hidden xl:flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white hover:bg-[#F8FAFC] border border-[#E2E8F0] text-[#334155] text-[11px] font-medium cursor-pointer">
          <span id="visionDot" class="w-2 h-2 rounded-full bg-[#2563EB]"></span>
          <span id="visionLabel">文本 + 视觉双轨</span>
        </button>

        <div class="h-4 w-px bg-[#E2E8F0]"></div>
      </div>

      <!-- Always-visible quiet Debug Mode Switch -->
      <button id="debugToggleBtn" class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg hover:bg-[#F8FAFC] transition cursor-pointer" title="开启后显示模板能力卡、段落映射、Token 账单与 OOXML/Poppler/视觉诊断">
        <span class="text-[12px] text-[#64748B] font-medium">调试模式</span>
        <span id="debugSwitchTrack" class="switch-track"><span class="switch-thumb"></span></span>
      </button>
    </div>
  </header>

  <!-- MAIN WORKBENCH -->
  <div class="flex-1 min-h-0 flex overflow-hidden">

    <!-- DEBUG-ONLY LEFT SIDEBAR (Hidden in Normal Mode!) -->
    <aside id="debugSidebar" class="hidden w-[268px] shrink-0 bg-[#F4F6F9] border-r border-[#E2E8F0] flex-col min-h-0">
      <div class="p-3 border-b border-[#E2E8F0] flex items-center justify-between">
        <span class="text-[12px] font-semibold text-[#0F172A]">模板资产库（调试视图）</span>
        <button id="sidebarImportBtn" class="text-[11.5px] font-medium text-[#2563EB] hover:underline cursor-pointer">+ 导入</button>
      </div>
      <div id="debugTplCards" class="flex-1 overflow-y-auto scroll-thin p-3 space-y-2"></div>
      <div class="p-3 border-t border-[#E2E8F0] bg-white">
        <div class="flex items-center justify-between text-[11px] font-semibold text-[#0F172A] mb-1.5">
          <span>上下文能力卡</span>
          <span id="capTokenBadge" class="font-mono font-normal text-[#64748B] tabular">~280 tok</span>
        </div>
        <div id="capCardBody" class="text-[11px] text-[#475569] space-y-1.5 leading-relaxed"></div>
      </div>
    </aside>

    <!-- CONTENT COLUMN (Calm, Spacious) -->
    <section id="contentCol" class="w-[44%] min-w-[360px] max-w-[540px] shrink-0 bg-white border-r border-[#E2E8F0] flex flex-col min-h-0">
      <!-- Clean Mode Tabs -->
      <div class="px-5 pt-4 pb-3 border-b border-[#F1F5F9] flex items-center justify-between gap-2">
        <div class="inline-flex p-1 rounded-[10px] bg-[#F1F5F9] text-[12.5px]">
          <button id="tabCopy" class="px-3.5 py-1.5 rounded-[7px] font-medium transition cursor-pointer">原文字套格式</button>
          <button id="tabChat" class="px-3.5 py-1.5 rounded-[7px] font-medium transition cursor-pointer">让 AI 写 / 改</button>
        </div>
        <span id="contentHint" class="text-[11.5px] text-[#64748B]">不改动原文一字</span>
      </div>

      <!-- Mode Body -->
      <div id="centerContent" class="flex-1 min-h-0 overflow-y-auto scroll-thin p-5 flex flex-col gap-4 select-text"></div>

      <!-- Debug-Only Quick Layout Surgery Bar (Hidden in Normal Mode!) -->
      <div id="debugSurgeryBar" class="hidden px-5 py-2.5 border-t border-[#E2E8F0] bg-[#F8FAFC]">
        <div class="text-[10.5px] font-medium text-[#64748B] mb-1.5">调试手术工具（强制触发）</div>
        <div class="flex flex-wrap gap-1.5 text-[11px]">
          <button data-act="compact" class="surgery-pill px-2.5 py-1 rounded-full bg-white hover:bg-[#EFF6FF] hover:text-[#1D4ED8] border border-[#E2E8F0] text-[#334155] font-medium cursor-pointer">切换溢出/压页</button>
          <button data-act="punct" class="surgery-pill px-2.5 py-1 rounded-full bg-white hover:bg-[#EFF6FF] hover:text-[#1D4ED8] border border-[#E2E8F0] text-[#334155] font-medium cursor-pointer">规范标点〔〕</button>
          <button data-act="vision" class="surgery-pill px-2.5 py-1 rounded-full bg-white hover:bg-[#EFF6FF] hover:text-[#1D4ED8] border border-[#E2E8F0] text-[#334155] font-medium cursor-pointer">强制视觉终审</button>
        </div>
      </div>

      <!-- Bottom Action Area -->
      <div id="centerFooter" class="px-5 py-3.5 border-t border-[#E2E8F0] bg-white"></div>
    </section>

    <!-- PREVIEW COLUMN (Primary Visual Focus) -->
    <main class="flex-1 min-w-0 flex flex-col min-h-0 bg-[#EEF2F6]">
      <!-- Minimal Preview Header -->
      <div class="h-[52px] shrink-0 bg-white/90 backdrop-blur border-b border-[#E2E8F0] px-5 flex items-center justify-between gap-3">
        <!-- Left: Human-friendly status (Normal) or Tech badges (Debug) -->
        <div id="previewStatusArea" class="flex items-center gap-2 text-[12.5px] min-w-0"></div>

        <!-- Right: Quiet Page Switcher + Single Primary Download CTA -->
        <div class="flex items-center gap-2.5 shrink-0">
          <!-- Debug-Only Zoom -->
          <div id="debugZoomWrap" class="hidden items-center bg-[#F1F5F9] border border-[#E2E8F0] rounded-lg p-0.5 text-[11px] tabular text-[#475569]">
            <button data-zoom="0.88" class="zoom-btn px-2 py-0.5 rounded-md cursor-pointer">88%</button>
            <button data-zoom="1" class="zoom-btn px-2 py-0.5 rounded-md bg-white text-[#0F172A] font-medium cursor-pointer">100%</button>
            <button data-zoom="1.12" class="zoom-btn px-2 py-0.5 rounded-md cursor-pointer">112%</button>
          </div>

          <div class="flex items-center bg-[#F1F5F9] rounded-lg p-0.5 text-[12px] text-[#475569] tabular">
            <button id="prevPage" class="w-7 h-7 flex items-center justify-center hover:bg-white rounded-md transition cursor-pointer">‹</button>
            <span id="pageIndicator" class="px-2 text-[11.5px] font-medium text-[#0F172A]">1 / 2</span>
            <button id="nextPage" class="w-7 h-7 flex items-center justify-center hover:bg-white rounded-md transition cursor-pointer">›</button>
          </div>

          <button id="downloadBtn" class="h-8 px-4 rounded-lg bg-[#2563EB] hover:bg-[#1D4ED8] text-white text-[12.5px] font-medium flex items-center gap-1.5 shadow-xs transition cursor-pointer">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span>下载 Word</span>
          </button>
        </div>
      </div>

      <!-- Contextual Human Suggestion Banner (ONLY appears when there is an actual layout issue!) -->
      <div id="suggestionBanner" class="hidden shrink-0 bg-[#FFFBEB] border-b border-[#FDE68A] px-5 py-2.5 flex items-center justify-between gap-3 text-[12.5px]">
        <div class="flex items-center gap-2 text-[#92400E]">
          <span class="w-2 h-2 rounded-full bg-[#F59E0B] shrink-0"></span>
          <span>第 3 页仅多出 2 行落款，可能影响打印美观</span>
        </div>
        <button id="oneClickFitBtn" class="h-7 px-3 rounded-lg bg-[#D97706] hover:bg-[#B45309] text-white text-[12px] font-medium shrink-0 transition cursor-pointer">
          一键压进 2 页
        </button>
      </div>

      <!-- Generous A4 Paper Canvas -->
      <div class="flex-1 min-h-0 overflow-y-auto scroll-thin dot-grid p-7 flex justify-center items-start">
        <div id="paperMount" class="paper-a4 w-[540px] min-h-[740px] rounded-[2px] px-12 py-11 flex flex-col justify-between relative"></div>
      </div>

      <!-- DEBUG-ONLY Bottom Diagnostics Drawer (Hidden in Normal Mode!) -->
      <div id="debugDrawer" class="hidden shrink-0 bg-white border-t border-[#E2E8F0]">
        <div class="px-4 h-9 flex items-center justify-between border-b border-[#F1F5F9]">
          <div class="flex items-center gap-1 text-[11.5px]">
            <button data-drawer="telemetry" class="drawer-tab px-2.5 py-1 rounded-md font-medium cursor-pointer">版面遥测 (Poppler)</button>
            <button data-drawer="ooxml" class="drawer-tab px-2.5 py-1 rounded-md font-medium cursor-pointer">OOXML 审计</button>
            <button data-drawer="vision" class="drawer-tab px-2.5 py-1 rounded-md font-medium cursor-pointer">视觉终审</button>
          </div>
          <span id="drawerSummary" class="text-[11px] text-[#64748B] font-mono tabular"></span>
        </div>
        <div id="drawerBody" class="px-4 py-3 text-[12px] max-h-[144px] overflow-y-auto scroll-thin"></div>
      </div>
    </main>

  </div>

  <!-- SIMPLE IMPORT FORMAT MODAL -->
  <div id="importModal" class="fixed inset-0 bg-[#0F172A]/30 backdrop-blur-[2px] hidden items-center justify-center p-4 z-50">
    <div class="bg-white border border-[#E2E8F0] rounded-2xl shadow-2xl w-full max-w-[440px] overflow-hidden">
      <div class="px-5 py-4 border-b border-[#F1F5F9] flex items-center justify-between">
        <div>
          <h3 class="text-[14.5px] font-semibold text-[#0F172A]">导入范例文档</h3>
          <p class="text-[12px] text-[#64748B] mt-0.5">上传一份标准 .doc / .docx，系统自动记住它的全部排版与红头</p>
        </div>
        <button id="closeImportModal" class="w-7 h-7 rounded-lg hover:bg-[#F1F5F9] text-[#64748B] flex items-center justify-center cursor-pointer">✕</button>
      </div>
      <div class="p-5 space-y-4 text-[12.5px]">
        <div class="border-2 border-dashed border-[#CBD5E1] hover:border-[#2563EB] bg-[#F8FAFC] rounded-xl p-6 text-center transition cursor-pointer">
          <div class="font-medium text-[#0F172A]">拖拽 .doc / .docx 文件到此处，或点击选择</div>
          <div class="text-[11.5px] text-[#64748B] mt-1">自动保留图片红头、封面、页眉页脚与表格样式</div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div class="col-span-2">
            <label class="block text-[12px] font-medium text-[#334155] mb-1">格式名称</label>
            <input id="newTplName" type="text" value="单位红头通知格式" class="w-full h-9 px-3 rounded-lg border border-[#CBD5E1] focus:border-[#2563EB] outline-none" />
          </div>
          <div>
            <label class="block text-[12px] font-medium text-[#334155] mb-1">分类</label>
            <select id="newTplCat" class="w-full h-9 px-2.5 rounded-lg border border-[#CBD5E1] bg-white outline-none">
              <option value="gongwen">公文</option>
              <option value="thesis">论文</option>
              <option value="contract">合同/表</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-[12px] font-medium text-[#334155] mb-1">额外要求（可选）</label>
          <input type="text" class="w-full h-9 px-3 rounded-lg border border-[#CBD5E1] focus:border-[#2563EB] outline-none" placeholder="例如：正文改成四号宋体，不要页码" />
        </div>
      </div>
      <div class="px-5 py-3.5 bg-[#F8FAFC] border-t border-[#F1F5F9] flex justify-end gap-2">
        <button id="cancelImportBtn" class="h-8 px-3.5 rounded-lg border border-[#CBD5E1] bg-white text-[12px] font-medium text-[#334155] hover:bg-[#F1F5F9] cursor-pointer">取消</button>
        <button id="confirmImportBtn" class="h-8 px-4 rounded-lg bg-[#2563EB] hover:bg-[#1D4ED8] text-white text-[12px] font-medium cursor-pointer">保存为格式</button>
      </div>
    </div>
  </div>

  <!-- Quiet Toast -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full bg-[#0F172A] text-white text-[12px] font-medium shadow-lg opacity-0 pointer-events-none transition-opacity z-50"></div>

  <script>
    const STATE = {
      debug: false,          // Default: Normal User Mode!
      popoverOpen: false,
      popoverCat: 'all',
      activeTemplateId: 'tpl_gongwen',
      mode: 'copy',          // 'copy' | 'chat'
      drawerTab: 'telemetry',
      visionEnabled: true,
      overflowSim: true,     // Shows contextual gentle suggestion banner on gongwen
      zoom: 1,
      page: 1,
      tokensUsed: 1240,
      branches: [
        { id: 'v2', name: 'v2 · 精简版', tplId: 'tpl_gongwen', msgCount: 4 },
        { id: 'root', name: 'root · 初始', tplId: 'tpl_gongwen', msgCount: 2 },
        { id: 'v3', name: 'v3 · 论文版', tplId: 'tpl_thesis', msgCount: 6 }
      ],
      activeBranchId: 'v2',
      chatMessages: [
        {
          role: 'user',
          text: '帮我起草一份实验室安全专项检查的通知，分两点写，保留原件红头和版记。'
        },
        {
          role: 'assistant',
          steps: [
            { status: 'ok', text: '加载能力卡「学校红头下行文模板」(280 tok)，无损保留 word/media 与版记' },
            { status: 'warn', text: 'Poppler 文本遥测：第 3 页溢出 2 行（孤立落款）' },
            { status: 'ok', text: '视觉终审（首页/末页 880px）：无遮挡错位（图片已阅后即焚）' }
          ],
          text: '已经按「学校红头下行文模板」排好了，完整保留了原件红头、五角星红线和文末版记。右侧可以直接预览，如果觉得第 3 页落款太孤单，点一下右上方的「一键压进 2 页」即可。'
        }
      ]
    };

    const TEMPLATES = [
      {
        id: 'tpl_gongwen',
        cat: 'gongwen',
        catLabel: '公文',
        name: '学校红头下行文模板',
        desc: '保留原件红头、五角星红线与文末版记',
        keepShell: 'word/media 红头 · VML 五角星 · 末页版记框',
        slots: ['发文字号', '主送机关', '抄送单位', '印发日期'],
        prototypes: ['二号小标宋标题', '黑体一级标题', '三级首句加粗', '三号仿宋正文'],
        capTokens: 280,
        draftDefault: `关于开展2026年度实验室安全专项检查的通知\n\n各二级学院、重点实验室：\n为切实加强校园实验室安全管理，防范化解重大风险隐患，经学校研究决定，于近期组织开展2026年度实验室安全专项检查。现将有关事项通知如下：\n\n一、检查范围与重点内容\n1.危化品全流程台账。各单位须逐瓶核对易制毒、易制爆及剧毒化学品出入库记录，严格落实双人双锁要求。\n2.特种设备与用电安全。重点排查高压灭菌锅、气瓶室及大功率加热设备运行状态。\n\n二、时间安排与报送要求\n请各单位于2026年12月5日前完成全面自查，通过校内OA系统报送自查汇总表。\n\n××大学党政办公室\n2026年11月24日`,
        mappings: [

        tabChat.className = 'px-3.5 py-1.5 rounded-[7px] font-medium bg-white text-[#0F172A] shadow-2xs transition cursor-pointer';
        tabCopy.className = 'px-3.5 py-1.5 rounded-[7px] font-medium text-[#64748B] hover:text-[#0F172A] transition cursor-pointer';
        hint.textContent = '像跟助理说话一样起草或微调';

        body.innerHTML = STATE.chatMessages.map(m => {
          if (m.role === 'user') {
            return `
              <div class="flex justify-end">
                <div class="max-w-[85%] rounded-2xl rounded-tr-sm bg-[#F1F5F9] px-4 py-2.5 text-[13px] leading-relaxed text-[#0F172A]">${m.text}</div>
              </div>
            `;
          }
          return `
            <div class="space-y-2">
              ${STATE.debug && m.steps ? `
                <details open class="rounded-lg border border-[#E2E8F0] bg-[#F8FAFC] p-2.5 text-[11px]">
                  <summary class="cursor-pointer font-medium text-[#475569]">[调试] Agent 工具轨迹 (${m.steps.length}步)</summary>
                  <div class="mt-2 space-y-1">
                    ${m.steps.map(s => `<div class="px-2 py-1 rounded bg-white border border-[#E2E8F0] text-[#334155]">${s.status === 'ok' ? '✓' : '⚠'} ${s.text}</div>`).join('')}
                  </div>
                </details>
              ` : ''}
              <div class="text-[13px] leading-[1.75] text-[#1E293B]">${m.text}</div>
            </div>
          `;
        }).join('');

        footer.innerHTML = `
          <div class="rounded-xl border border-[#CBD5E1] focus-within:border-[#2563EB] focus-within:ring-2 focus-within:ring-[#EFF6FF] bg-white px-3 py-2 flex items-end gap-2 transition">
            <textarea id="chatInput" rows="2" class="w-full text-[13px] leading-relaxed text-[#0F172A] placeholder-[#94A3B8] outline-none resize-none bg-transparent" placeholder="说说想写什么，或者想怎么调格式…"></textarea>
            <button id="sendChatBtn" class="h-8 px-4 rounded-lg bg-[#2563EB] hover:bg-[#1D4ED8] text-white text-[12.5px] font-medium shrink-0 transition cursor-pointer">发送</button>
          </div>
        `;
        document.getElementById('sendChatBtn').onclick = () => {
          const inp = document.getElementById('chatInput');
          const v = inp.value.trim();
          if (!v) return;
          STATE.chatMessages.push({ role: 'user', text: v });
          STATE.chatMessages.push({
            role: 'assistant',
            steps: [{ status: 'ok', text: `确定性更新版式并复审「${v.slice(0, 18)}」` }],
            text: '已经按你的要求改好了，右侧是最新的 Word 预览效果。'
          });
          STATE.tokensUsed += 420;
          inp.value = '';
          renderAll();
        };
      }
    }

    function renderPreviewColumn() {
      const tpl = activeTpl();
      const hasOverflow = STATE.activeTemplateId === 'tpl_gongwen' && STATE.overflowSim;
      const pages = tpl.pages(hasOverflow);
      if (STATE.page > pages.length) STATE.page = pages.length;

      // Top status area: calm human sentence in Normal mode, tech badges in Debug mode
      const statusArea = document.getElementById('previewStatusArea');
      if (!STATE.debug) {
        statusArea.innerHTML = hasOverflow
          ? `<span class="w-2 h-2 rounded-full bg-[#F59E0B] shrink-0"></span><span class="font-medium text-[#92400E] truncate">共 ${pages.length} 页 · 建议优化末页排版</span>`
          : `<span class="w-2 h-2 rounded-full bg-[#10B981] shrink-0"></span><span class="font-medium text-[#0F172A] truncate">共 ${pages.length} 页 · 格式已排好，可直接打印</span>`;
      } else {
        statusArea.innerHTML = `
          <span class="px-2 py-0.5 rounded-full bg-[#ECFDF5] text-[#059669] border border-[#A7F3D0] text-[11px] font-medium">OOXML 100%</span>
          <span class="px-2 py-0.5 rounded-full text-[11px] font-medium border ${
            hasOverflow ? 'bg-[#FFFBEB] text-[#B45309] border-[#FDE68A]' : 'bg-[#ECFDF5] text-[#059669] border-[#A7F3D0]'
          }">${hasOverflow ? '⚠ 末页溢出2行' : `✓ 版面 ${pages.length}页`}</span>
          <span class="px-2 py-0.5 rounded-full text-[11px] font-medium border ${
            STATE.visionEnabled ? 'bg-[#EFF6FF] text-[#1D4ED8] border-[#BFDBFE]' : 'bg-[#F1F5F9] text-[#64748B] border-[#E2E8F0]'
          }">${STATE.visionEnabled ? '视觉 ✓' : '纯文本'}</span>
        `;
      }

      // Contextual gentle suggestion banner (only when overflow exists!)
      const banner = document.getElementById('suggestionBanner');
      banner.classList.toggle('hidden', !hasOverflow);
      banner.classList.toggle('flex', hasOverflow);

      // Zoom visibility (Debug only)
      const zoomWrap = document.getElementById('debugZoomWrap');
      zoomWrap.classList.toggle('hidden', !STATE.debug);
      zoomWrap.classList.toggle('flex', STATE.debug);

      document.getElementById('pageIndicator').textContent = `${STATE.page} / ${pages.length}`;
      const mount = document.getElementById('paperMount');
      mount.innerHTML = pages[STATE.page - 1];
      mount.style.transform = `scale(${STATE.debug ? STATE.zoom : 1})`;

      // Debug-Only Bottom Diagnostics Drawer
      const drawer = document.getElementById('debugDrawer');
      drawer.classList.toggle('hidden', !STATE.debug);
      if (STATE.debug) {
        document.querySelectorAll('.drawer-tab').forEach(b => {
          const on = b.dataset.drawer === STATE.drawerTab;
          b.className = `drawer-tab px-2.5 py-1 rounded-md font-medium cursor-pointer ${
            on ? 'bg-[#EFF6FF] text-[#1D4ED8]' : 'text-[#64748B] hover:text-[#0F172A]'
          }`;
        });
        document.getElementById('drawerSummary').textContent = hasOverflow ? '1 项版面警报' : '0 违规 · 双轨通过';
        const dBody = document.getElementById('drawerBody');
        if (STATE.drawerTab === 'telemetry') {
          const bars = hasOverflow
            ? [{ p: '第 1 页', l: '22行 · 96%', pct: 96, w: false }, { p: '第 2 页', l: '22行 · 95%', pct: 95, w: false }, { p: '第 3 页', l: '2行 · 孤立落款', pct: 9, w: true }]
            : [{ p: '第 1 页', l: '22行 · 95%', pct: 95, w: false }, { p: `第 ${pages.length} 页`, l: '19行 · 88%', pct: 88, w: false }];
          dBody.innerHTML = `<div class="grid grid-cols-3 gap-2.5">${bars.map(b => `
            <div class="p-2 rounded-lg border ${b.w ? 'bg-[#FFFBEB] border-[#FDE68A]' : 'bg-[#F8FAFC] border-[#E2E8F0]'}">
              <div class="flex justify-between text-[11px] mb-1"><span class="font-semibold">${b.p}</span><span class="font-mono ${b.w ? 'text-[#B45309]' : 'text-[#64748B]'}">${b.l}</span></div>
              <div class="h-1.5 rounded-full bg-[#E2E8F0] overflow-hidden"><div class="h-full ${b.w ? 'bg-[#F59E0B]' : 'bg-[#2563EB]'}" style="width:${b.pct}%"></div></div>
            </div>
          `).join('')}</div>`;
        } else if (STATE.drawerTab === 'ooxml') {
          dBody.innerHTML = `<div class="grid grid-cols-4 gap-2 text-[11px]">
            <div class="p-2 rounded bg-[#F8FAFC] border border-[#E2E8F0]">✓ rFonts 四属性分离</div>
            <div class="p-2 rounded bg-[#F8FAFC] border border-[#E2E8F0]">✓ jc="both" + 双缩进</div>
            <div class="p-2 rounded bg-[#F8FAFC] border border-[#E2E8F0]">✓ word/media 留壳存活</div>
            <div class="p-2 rounded bg-[#F8FAFC] border border-[#E2E8F0]">✓ docGrid 22×28</div>
          </div>`;
        } else {
          dBody.innerHTML = STATE.visionEnabled
            ? `<div class="p-2.5 rounded-lg bg-[#EFF6FF]/60 border border-[#BFDBFE] text-[11.5px] flex justify-between items-center">
                <span>关键页（首页/末页 880px）终审通过：无重叠遮挡、红头居中、版记沉底。</span>
                <span class="font-mono text-[10.5px] text-[#1D4ED8] bg-white px-2 py-0.5 rounded border border-[#BFDBFE]">历史图片已阅后即焚 ✓</span>
               </div>`
            : `<div class="p-2.5 rounded-lg bg-[#F8FAFC] border border-[#E2E8F0] text-[#64748B] text-[11.5px]">未配置视觉模型，已优雅降级为纯文本遥测模式。</div>`;
        }
      }
    }

    function renderAll() {
      renderHeader();
      renderDebugSidebar();
      renderContentColumn();
      renderPreviewColumn();
    }

    // Bindings
    document.getElementById('debugToggleBtn').onclick = () => {
      STATE.debug = !STATE.debug;
      toast(STATE.debug ? '已开启调试模式：显示全部技术诊断信息' : '已切回普通模式：极简专注视图');
      renderAll();
    };
    document.getElementById('formatPickerBtn').onclick = (e) => {
      e.stopPropagation();
      STATE.popoverOpen = !STATE.popoverOpen;
      renderHeader();
    };
    document.addEventListener('click', () => {
      if (STATE.popoverOpen) { STATE.popoverOpen = false; renderHeader(); }
    });
    document.getElementById('tabCopy').onclick = () => { STATE.mode = 'copy'; renderContentColumn(); };
    document.getElementById('tabChat').onclick = () => { STATE.mode = 'chat'; renderContentColumn(); };
    document.getElementById('visionModeToggle').onclick = () => { STATE.visionEnabled = !STATE.visionEnabled; renderAll(); };

    document.getElementById('oneClickFitBtn').onclick = () => {
      STATE.overflowSim = false;
      STATE.page = 2;
      STATE.tokensUsed += 140;
      toast('已自动微调行距，落款已收进第 2 页');
      renderAll();
    };

    document.getElementById('prevPage').onclick = () => { if (STATE.page > 1) { STATE.page--; renderPreviewColumn(); } };
    document.getElementById('nextPage').onclick = () => {
      const maxP = activeTpl().pages(STATE.activeTemplateId === 'tpl_gongwen' && STATE.overflowSim).length;
      if (STATE.page < maxP) { STATE.page++; renderPreviewColumn(); }
    };

    document.querySelectorAll('.drawer-tab').forEach(b => {
      b.onclick = () => { STATE.drawerTab = b.dataset.drawer; renderPreviewColumn(); };
    });

    document.querySelectorAll('.zoom-btn').forEach(b => {
      b.onclick = () => {
        STATE.zoom = parseFloat(b.dataset.zoom);
        document.querySelectorAll('.zoom-btn').forEach(x => x.className = 'zoom-btn px-2 py-0.5 rounded-md cursor-pointer');
        b.className = 'zoom-btn px-2 py-0.5 rounded-md bg-white text-[#0F172A] font-medium cursor-pointer';
        renderPreviewColumn();
      };
    });

    document.querySelectorAll('.surgery-pill').forEach(b => {
      b.onclick = () => {
        if (b.dataset.act === 'compact') {
          STATE.overflowSim = !STATE.overflowSim;
          STATE.page = STATE.overflowSim ? 3 : 2;
          renderAll();
        } else if (b.dataset.act === 'punct') {
          toast('已规范 2 处公文六角括号〔〕');
        } else {
          STATE.visionEnabled = true;
          STATE.drawerTab = 'vision';
          renderAll();
        }
      };
    });

    document.getElementById('branchSelect').onchange = (e) => {
      STATE.activeBranchId = e.target.value;
      const br = STATE.branches.find(b => b.id === STATE.activeBranchId);
      if (br) STATE.activeTemplateId = br.tplId;
      STATE.page = 1;
      renderAll();
    };
    document.getElementById('forkBranchBtn').onclick = () => {
      const id = 'v' + (STATE.branches.length + 2);
      STATE.branches.unshift({ id, name: `${id} · 新分支`, tplId: STATE.activeTemplateId, msgCount: STATE.chatMessages.length });
      STATE.activeBranchId = id;
      renderHeader();
    };

    // Modal
    const modal = document.getElementById('importModal');
    const openModal = (e) => { if (e) e.stopPropagation(); STATE.popoverOpen = false; modal.classList.remove('hidden'); modal.classList.add('flex'); renderHeader(); };
    const closeModal = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); };
    document.getElementById('popoverImportBtn').onclick = openModal;
    document.getElementById('sidebarImportBtn').onclick = openModal;
    document.getElementById('closeImportModal').onclick = closeModal;
    document.getElementById('cancelImportBtn').onclick = closeModal;
    document.getElementById('confirmImportBtn').onclick = () => {
      const name = document.getElementById('newTplName').value.trim() || '自定义格式';
      const cat = document.getElementById('newTplCat').value;
      const base = TEMPLATES.find(t => t.cat === cat) || TEMPLATES[0];
      const id = 'tpl_' + Date.now();
      TEMPLATES.unshift({ ...base, id, name, desc: '刚从范例文档导入保存' });
      STATE.activeTemplateId = id;
      closeModal();
      toast('已保存新格式「' + name + '」');
      renderAll();
    };

    document.getElementById('downloadBtn').onclick = () => toast('示例模式：将下载最终合规 Word (.docx)');

    renderAll();
  </script>
</body>
</html>
